# Cloudflare Workers deployment (Next.js via @opennextjs/cloudflare + D1).
#
# One-time setup — see README.md "Deploy to Cloudflare":
#   1. npx wrangler d1 create ytrankwar-db      -> paste the database_id below
#   2. set the secrets (DODO_*, YOUTUBE_API_KEY) with `wrangler secret put`
#   3. set SITE_URL below to your main domain
#   4. npm run deploy   (applies D1 migrations, builds, deploys)

name = "ytrankwar"
main = "worker.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "ytrankwar-db"
database_id = "7c39b21e-7483-4fc7-bb52-974b3115a3cc" # printed by `wrangler d1 create ytrankwar-db`
migrations_dir = "migrations"

# Non-secret configuration. Secrets (never put these here):
#   wrangler secret put DODO_PAYMENTS_API_KEY
#   wrangler secret put DODO_PAYMENTS_WEBHOOK_KEY
#   wrangler secret put YOUTUBE_API_KEY
[vars]
SITE_URL = "https://ytrankwar.lol"
DODO_PAYMENTS_ENVIRONMENT = "test_mode" # switch to "live_mode" when you go live
DODO_PRODUCT_ID = "REPLACE_WITH_DODO_PAY_WHAT_YOU_WANT_PRODUCT_ID"

# Attach your main domain (the domain's DNS must be on Cloudflare), then
# uncomment and deploy again:
[[routes]]
pattern = "ytrankwar.lol"
custom_domain = true
#
[[routes]]
pattern = "www.ytrankwar.lol"
custom_domain = true

# [[durable_objects.bindings]]
# name = "BID_COORDINATOR"
# class_name = "BidCoordinator"
#
# [[migrations]]
# tag = "v1"
# new_sqlite_classes = ["BidCoordinator"]

# Uncomment if/when channel avatars or OG card images are stored in R2
# instead of generated on the fly.
# [[r2_buckets]]
# binding = "ASSETS"
# bucket_name = "ytrankwar-assets"

# Hourly: refresh cached YouTube statistics and rebuild the rank cache.
# Never call the YouTube Data API on a live page request.
[triggers]
crons = ["0 * * * *"]