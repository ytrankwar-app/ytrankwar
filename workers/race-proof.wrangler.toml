name = "race-proof"
compatibility_date = "2026-08-01"
main = "race-proof.mjs"

[[durable_objects.bindings]]
name = "UNSAFE_COUNTER"
class_name = "UnsafeCounter"

[[durable_objects.bindings]]
name = "SAFE_COUNTER"
class_name = "SafeCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UnsafeCounter", "SafeCounter"]

[[d1_databases]]
binding = "DB"
database_name = "race-proof-db"
database_id = "00000000-0000-0000-0000-000000000001"
